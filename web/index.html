<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
  <title>حجز أرقام الخطابات | مجموعة العمرو</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <strong>مجموعة العمرو</strong>
        <span>للاستشارات الهندسية</span>
      </div>
      <button id="logout" class="top-button" type="button" hidden>تسجيل الخروج</button>
    </div>
  </header>
  <main>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="login-view" class="login card" aria-labelledby="login-title" hidden>
      <h1 id="login-title">حجز أرقام الخطابات</h1>
      <p class="muted">سجّل الدخول بحسابك للمتابعة.</p>
      <form id="login-form">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" dir="ltr" maxlength="254" autocomplete="username" required>
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" dir="ltr" maxlength="128" autocomplete="current-password" required>
        <button type="submit">تسجيل الدخول</button>
      </form>
    </section>
    <div id="workspace" hidden>
      <div class="intro">
        <div>
          <h1>حجز أرقام الخطابات</h1>
          <p id="welcome" class="muted"></p>
        </div>
        <button class="secondary" id="admin-toggle" type="button" aria-expanded="false" aria-controls="admin-view" hidden>إدارة المستخدمين</button>
      </div>
      <section class="card" aria-labelledby="reservation-title">
        <h2 id="reservation-title">حجز جديد</h2>
        <form id="reservation-form">
          <label for="subject">موضوع الخطاب</label>
          <div class="form-line">
            <input id="subject" name="subject" maxlength="200" required>
            <button type="submit">حجز رقم</button>
          </div>
        </form>
        <div id="receipt" class="receipt" hidden>
          <div>
            <span>رقم الخطاب المحجوز</span>
            <bdi id="letter-number" dir="ltr"></bdi>
          </div>
          <button id="copy" class="secondary" type="button">نسخ الرقم</button>
        </div>
      </section>
      <section id="admin-view" class="card" aria-labelledby="admin-title" hidden>
        <h2 id="admin-title">إدارة المستخدمين</h2>
        <form id="user-form" class="user-form">
          <div>
            <label for="new-name">اسم الموظف</label>
            <input id="new-name" name="name" maxlength="100" required>
          </div>
          <div>
            <label for="new-email">البريد الإلكتروني</label>
            <input id="new-email" name="email" type="email" dir="ltr" maxlength="254" autocomplete="off" required>
          </div>
          <div>
            <label for="new-password">كلمة المرور</label>
            <input id="new-password" name="password" type="password" dir="ltr" minlength="10" maxlength="128" autocomplete="new-password" required>
          </div>
          <button type="submit">إضافة مستخدم</button>
        </form>
        <div class="table-wrap">
          <table aria-label="حسابات الموظفين">
            <thead><tr><th scope="col">الموظف</th><th scope="col">البريد</th><th scope="col">الحالة</th><th scope="col">الإجراءات</th></tr></thead>
            <tbody id="users"></tbody>
          </table>
        </div>
      </section>
      <section class="card" aria-labelledby="letters-title">
        <div class="section-top">
          <h2 id="letters-title">حجوزاتي</h2>
          <form id="search-form" class="search">
            <label class="sr-only" for="query">البحث بالرقم أو الموضوع</label>
            <input id="query" type="search" name="query" maxlength="200" placeholder="البحث بالرقم أو الموضوع">
            <button class="secondary" type="submit">بحث</button>
          </form>
        </div>
        <div class="table-wrap">
          <table aria-labelledby="letters-title">
            <thead><tr><th scope="col">الرقم</th><th scope="col">الموضوع</th><th scope="col">حجزه</th><th scope="col">التاريخ والوقت</th></tr></thead>
            <tbody id="letters"></tbody>
          </table>
        </div>
        <nav id="pagination" class="pagination" aria-label="صفحات الحجوزات" hidden>
          <button id="previous" class="secondary" type="button">السابق</button>
          <span id="page-number"></span>
          <button id="next" class="secondary" type="button">التالي</button>
        </nav>
      </section>
    </div>
    <noscript>فعّل JavaScript لاستخدام نظام حجز أرقام الخطابات.</noscript>
  </main>
  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">إعادة تعيين كلمة المرور</h2>
    <p id="reset-name"></p>
    <form id="reset-form">
      <label for="reset-password">كلمة المرور الجديدة</label>
      <input id="reset-password" name="password" type="password" dir="ltr" minlength="10" maxlength="128" autocomplete="new-password" required>
      <p id="reset-error" class="error-text" role="alert" hidden></p>
      <div class="actions">
        <button type="submit">حفظ</button>
        <button id="cancel-reset" class="secondary" type="button">إلغاء</button>
      </div>
    </form>
  </dialog>
</body>
</html>
