name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - uses: actions/configure-pages@v5
      - name: Configure entry page
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node --input-type=module <<'JS'
          import { copyFileSync, readFileSync, writeFileSync } from 'node:fs';
          const url = new URL(process.env.APP_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('APP_URL must be an HTTPS origin without a path');
          }
          const html = readFileSync('pages/index.html', 'utf8');
          writeFileSync('pages/index.html', html.replace('__APP_URL__', url.origin));
          copyFileSync('web/styles.css', 'pages/styles.css');
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deploy
